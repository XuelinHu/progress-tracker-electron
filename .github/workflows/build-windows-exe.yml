name: Build Windows EXE

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows installers
        run: npm run dist:win -- --publish never

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-electron/Progress-Tracker-Desktop-*.exe
            dist-electron/Progress-Tracker-Desktop-*.blockmap
          if-no-files-found: error

      - name: Upload Windows EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/Progress-Tracker-Desktop-*.exe
            dist-electron/Progress-Tracker-Desktop-*.blockmap
          generate_release_notes: true
